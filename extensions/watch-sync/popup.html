<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>一起看网站同步</title
  ><link rel="stylesheet" href="popup.css" />
  <body>
    <h1>网站一起看</h1>
    <p>先在一起看房间连接扩展，再打开官方影片。请各自登录并取得观看权限。</p>
    <button id="connect">连接这个房间</button><button id="open">打开影片并授权</button
    ><button id="stop">断开同步</button>
    <p id="status" role="status"></p>
    <small>正片开始后才开启同步；遇到广告、试看或切集请停止同步。保持房间页打开。</small>
    <script src="popup.js"></script>
  </body>
</html>
