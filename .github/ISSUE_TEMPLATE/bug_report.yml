name: 问题反馈
description: 报告连接、播放或界面问题
body:
  - type: markdown
    attributes:
      value: 请勿附上影片、完整邀请链接、Cookie、密钥或私人聊天。截图请先隐藏这些内容。
  - type: input
    id: environment
    attributes:
      label: 使用环境
      placeholder: 例如 Windows 11、Chrome 版本、体验站或自行部署
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: 连接方式
      options:
        - 直连
        - 云端转发
        - 视频网站同步
        - 不确定
  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      description: 从打开网页开始，说明做了哪些操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可以附上错误提示或已隐藏私人信息的截图。
    validations:
      required: true
